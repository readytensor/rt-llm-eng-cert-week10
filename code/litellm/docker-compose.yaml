version: "3.9"

services:
  # ===========================================
  # PostgreSQL for Spend Tracking
  # ===========================================
  postgres:
    image: postgres:15
    container_name: litellm-postgres
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # LiteLLM Proxy
  # ===========================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - MODAL_API_KEY=${MODAL_API_KEY}  # Uncomment if using Modal
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      # Admin UI access
      - LITELLM_MASTER_KEY=sk-litellm-master-key
      - UI_USERNAME=admin
      - UI_PASSWORD=admin
      # Slack alerts
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # LangSmith tracing
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-litellm-proxy}
      - LANGSMITH_TRACING=true
      # Optional: Connect to your local Langfuse
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3000}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

